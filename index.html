<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hockey GM Simulator</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    
    <!-- SIDEBAR -->
    <aside class="sidebar">

        <button class="nav-btn active" onclick="showScreen('dashboard', this)">
            Dashboard
        </button>

        <button class="nav-btn" onclick="showScreen('roster', this)">
            Roster
        </button>

        <button class="nav-btn" onclick="showScreen('league', this)">
            League
        </button>

        <button class="nav-btn" onclick="showScreen('calendar', this)">
            Calendar
        </button>

        <button class="nav-btn" onclick="showScreen('settings', this)">
            Settings
        </button>

    </aside>

    <!-- HEADER -->
    <header class="topbar">
        <h1 id="teamName">Hockey GM</h1>

        <div id="currentDate">Oct 1, 1960</div>

        <div class="record-box">
            <span>W <span id="wins">0</span></span>
            <span>L <span id="losses">0</span></span>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- START SCREEN -->
        <section class="panel" id="startScreen">

            <h2>Select Team</h2>

            <select id="teamSelect"></select>

            <button onclick="startGame()">
                Start Game
            </button>

        </section>


        <!-- DASHBOARD -->
        <section id="dashboardScreen" class="screen">

            <!-- LINEUP -->
            <section class="panel">
                <h2>Starting Lineup</h2>
                <div id="lineup" class="lineup-cards"></div>
            </section>

            <!-- TODAY DISPLAY-->   
            <div class="panel">
                <h2>Today</h2>
                <p id="todayMatchup">No game scheduled</p>
            </div>

            <!-- CONTROLS -->
            <section class="panel">

                <h2>Game Controls</h2>

                <button onclick="simDay()">Sim Day</button>
                <button onclick="simWeek()">Sim Week</button>

                <div class="game-result">
                    <strong>Latest:</strong>
                    <span id="gameResult">No games yet</span>
                </div>

            </section>

        </section>


        <!-- ROSTER SCREEN -->
        <section id="rosterScreen" class="screen hidden">

            <section class="panel">
                <h2>Roster</h2>
                <div id="rosterList"></div>
            </section>

        </section>

        <!-- LEAGUE SCREEN -->
        <section id="leagueScreen" class="screen hidden">

            <section class="panel">

                <h2>Standings</h2>

                <table class="standings-table">
                    <thead>
                        <tr>
                            <th>Team</th>
                            <th>W</th>
                            <th>L</th>
                            <th>PCT</th>
                        </tr>
                    </thead>

                    <tbody id="standings"></tbody>
                </table>

            </section>

        </section>

        <!-- CALENDAR SCREEN -->
        <section id="calendarScreen" class="screen hidden">

            <section class="panel">

                <h2>Calendar</h2>

                
                <div class="calendar-controls">
                    <button onclick="prevMonth()">◀</button>
                    <span id="calendarMonth"></span>
                    <button onclick="nextMonth()">▶</button>
                </div>

                <div id="calendarList"></div>

            </section>

        </section>



        
        <!-- SETTINGS SCREEN -->
        <section id="settingsScreen" class="screen hidden">

            <section class="panel">

                <h2>Settings</h2>

                <button onclick="resetGame()">
                    New Game
                </button>

            </section>

        </section>



    </main>






    

    <!-- PLAYER DETAIL MODAL -->
<div id="playerModal" class="player-modal hidden">
    <div class="player-modal-content">

        <div class="player-modal-header">
            <h2 id="playerModalName">Player Name</h2>
            <button class="player-close-btn" onclick="closePlayerModal()">✕</button>
        </div>

        <div class="player-modal-body">

            <section class="player-section">
                <h3>Profile</h3>
                <div id="playerProfile"></div>
            </section>

            <section class="player-section">
                <h3>Attributes</h3>
                <div id="playerAttributes"></div>
            </section>

            <section class="player-section">
                <h3>Current Season</h3>
                <div id="playerSeasonStats"></div>
            </section>

            <section class="player-section">
                <h3>Career Stats</h3>
                <div id="playerCareerStats"></div>
            </section>

        </div>
    </div>
</div>

    <!-- SCRIPTS -->
    <script type="module" src="./js/main.js"></script>
    <script src="./js/ui/sidebar.js"></script>

</body>

</html>
